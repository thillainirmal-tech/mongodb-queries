name: Validate sources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check JavaScript syntax
        run: node --check assignment2_queries.js
      - name: Validate dataset JSON
        run: python -c "import json, pathlib; [json.loads(line) for line in pathlib.Path('restaurants.json').open(encoding='utf-8') if line.strip()]"
      - name: Check Python syntax
        run: python -m py_compile build_assignment_pdf.py
