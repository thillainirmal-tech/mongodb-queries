name: Bug report
description: Report an incorrect query, result, or documentation problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command, query number, and relevant output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: MongoDB, mongosh, Python, and operating-system versions.
    validations:
      required: true
